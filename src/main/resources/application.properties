quarkus.application.name=canary-control
quarkus.http.host=0.0.0.0
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-configured}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=20s
quarkus.langchain4j.openai.max-retries=1
quarkus.langchain4j.ai-service.max-tool-executions=4
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://jaeger:4317}
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.scheduler.enabled=false
%test.demo.ai-mode=fixture
%test.demo.api-token=test-token
%dev.demo.api-token=${DEMO_API_TOKEN:demo-local}
demo.ai-mode=${DEMO_AI_MODE:live}
demo.role=${DEMO_ROLE:control}
demo.release=${DEMO_RELEASE:v1}
demo.api-token=${DEMO_API_TOKEN:}
demo.proxy-auth-enabled=${DEMO_PROXY_AUTH_ENABLED:false}
%dev.demo.cluster-enabled=false
demo.cluster-enabled=${DEMO_CLUSTER_ENABLED:false}
demo.namespace=${DEMO_NAMESPACE:canary-demo}
demo.gitops-namespace=${DEMO_GITOPS_NAMESPACE:openshift-gitops}
demo.inventory-url=${INVENTORY_URL:http://inventory:8080}
demo.checkout-url=${CHECKOUT_URL:http://checkout:8080}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] traceId=%X{traceId} %s%e%n
quarkus.devservices.enabled=false
