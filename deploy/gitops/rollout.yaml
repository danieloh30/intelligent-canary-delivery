{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Rollout",
  "metadata": {
    "name": "checkout"
  },
  "spec": {
    "replicas": 10,
    "revisionHistoryLimit": 3,
    "selector": {
      "matchLabels": {
        "app": "checkout"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "checkout"
        },
        "annotations": {
          "demo.canary/released-at": "2026-10-24T20:33:03.731729+00:00"
        }
      },
      "spec": {
        "serviceAccountName": "canary-workload",
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "checkout",
            "image": "image-registry.openshift-image-registry.svc:5000/canary-demo/canary-demo:latest",
            "imagePullPolicy": "Always",
            "ports": [
              {
                "containerPort": 8080,
                "name": "http"
              }
            ],
            "env": [
              {
                "name": "DEMO_ROLE",
                "value": "checkout"
              },
              {
                "name": "DEMO_RELEASE",
                "value": "v2"
              },
              {
                "name": "QUARKUS_OTEL_RESOURCE_ATTRIBUTES",
                "value": "service.name=checkout"
              },
              {
                "name": "DEMO_API_TOKEN",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "canary-secrets",
                    "key": "api-token"
                  }
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "160Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "512Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "runAsNonRoot": true,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/q/health/ready",
                "port": "http"
              },
              "initialDelaySeconds": 5
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/q/health/live",
                "port": "http"
              },
              "initialDelaySeconds": 30
            },
            "startupProbe": {
              "httpGet": {
                "path": "/q/health/started",
                "port": "http"
              },
              "failureThreshold": 40,
              "periodSeconds": 5
            }
          }
        ]
      }
    },
    "strategy": {
      "canary": {
        "stableService": "checkout-stable",
        "canaryService": "checkout-canary",
        "maxSurge": 1,
        "maxUnavailable": 0,
        "steps": [
          {
            "setWeight": 10
          },
          {
            "pause": {
              "duration": "15s"
            }
          },
          {
            "analysis": {
              "templates": [
                {
                  "templateName": "reasoning-gate"
                }
              ],
              "args": [
                {
                  "name": "release",
                  "value": "v2"
                }
              ]
            }
          },
          {
            "setWeight": 50
          },
          {
            "pause": {
              "duration": "15s"
            }
          },
          {
            "analysis": {
              "templates": [
                {
                  "templateName": "reasoning-gate"
                }
              ],
              "args": [
                {
                  "name": "release",
                  "value": "v2"
                }
              ]
            }
          },
          {
            "setWeight": 100
          }
        ]
      }
    }
  }
}
