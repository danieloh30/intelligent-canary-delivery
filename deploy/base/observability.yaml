{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "prometheus"
  },
  "data": {
    "prometheus.yml": "global:\n  scrape_interval: 5s\nscrape_configs:\n  - job_name: canary-pods\n    metrics_path: /q/metrics\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n          names: [canary-demo]\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_label_app]\n        action: keep\n        regex: checkout|inventory|canary-control\n      - source_labels: [__meta_kubernetes_pod_container_port_name]\n        action: keep\n        regex: http\n      - source_labels: [__meta_kubernetes_pod_name]\n        target_label: pod\n      - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]\n        target_label: revision\n"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "prometheus"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "prometheus"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "prometheus"
        }
      },
      "spec": {
        "automountServiceAccountToken": true,
        "containers": [
          {
            "name": "prometheus",
            "image": "quay.io/prometheus/prometheus:v3.7.2",
            "args": [
              "--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=2h"
            ],
            "ports": [
              {
                "containerPort": 9090
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "runAsNonRoot": true,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "512Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/prometheus"
              },
              {
                "name": "data",
                "mountPath": "/prometheus"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "prometheus"
            }
          },
          {
            "name": "data",
            "emptyDir": {}
          }
        ],
        "serviceAccountName": "prometheus"
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "prometheus"
  },
  "spec": {
    "selector": {
      "app": "prometheus"
    },
    "ports": [
      {
        "name": "http",
        "port": 9090,
        "targetPort": 9090
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "jaeger"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "jaeger"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "jaeger"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "jaeger",
            "image": "jaegertracing/all-in-one:1.76.0",
            "env": [
              {
                "name": "COLLECTOR_OTLP_ENABLED",
                "value": "true"
              }
            ],
            "ports": [
              {
                "containerPort": 16686
              },
              {
                "containerPort": 4317
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "runAsNonRoot": true,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "512Mi"
              }
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "jaeger"
  },
  "spec": {
    "selector": {
      "app": "jaeger"
    },
    "ports": [
      {
        "name": "query",
        "port": 16686,
        "targetPort": 16686
      },
      {
        "name": "otlp",
        "port": 4317,
        "targetPort": 4317
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "prometheus"
  }
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "prometheus-discovery"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "prometheus-discovery"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "prometheus"
    }
  ],
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "prometheus-discovery"
  }
}
