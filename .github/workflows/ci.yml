name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Java and build production artifact
        run: ./mvnw -B verify
      - name: Validate manifests and scripts
        run: |
          bash -n demo.sh scripts/*.sh
          python3 scripts/check-manifests.py
          python3 scripts/check-diagrams.py
          python3 -m unittest discover -s tests/scripts -v
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start offline rehearsal server
        run: |
          DEMO_AI_MODE=fixture DEMO_API_TOKEN=browser-test QUARKUS_OTEL_SDK_DISABLED=true java -jar target/quarkus-app/quarkus-run.jar > /tmp/canary.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://localhost:8080/q/health/ready && exit 0; sleep 2; done
          cat /tmp/canary.log
          exit 1
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: test-results/
