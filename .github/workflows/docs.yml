name: Publish tutorial site
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - src/main/resources/META-INF/resources/diagrams/**
      - src/main/resources/META-INF/resources/diagrams.js
      - src/main/resources/META-INF/resources/mermaid-solid-fills.js
      - src/main/resources/META-INF/resources/vendor/**
      - tests/docs/**
      - playwright.docs.config.js
      - package.json
      - package-lock.json
      - scripts/check-diagrams.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - src/main/resources/META-INF/resources/diagrams/**
      - src/main/resources/META-INF/resources/diagrams.js
      - src/main/resources/META-INF/resources/mermaid-solid-fills.js
      - src/main/resources/META-INF/resources/vendor/**
      - tests/docs/**
      - playwright.docs.config.js
      - package.json
      - package-lock.json
      - scripts/check-diagrams.py
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python3 scripts/check-diagrams.py
      - run: mkdocs build --strict
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify tutorial navigation, mobile layout, and diagrams
        run: npx playwright test -c playwright.docs.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-browser-failure
          path: test-results/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5
